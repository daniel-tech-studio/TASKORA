<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7F8FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111426" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="TASKORA — gestion personnelle de tâches, claire et sereine." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TASKORA</title>
    <script>
      // Anti-flash : applique le thème mémorisé (ou celui du système) avant le premier rendu.
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('taskora-theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
